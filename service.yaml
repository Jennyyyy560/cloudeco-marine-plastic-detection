# Kubernetes Service (NodePort) - Exposes the CloudEco pods to the internet.
apiVersion: v1
kind: Service
metadata:
  name: cloudeco-service
spec:
  type: NodePort                  
  selector:
    app: cloudeco                 
 
  ports:
    - protocol: TCP
      port: 80                    # Port exposed on the internal ClusterIP
      targetPort: 8000            # Port the FastAPI container listens on
      nodePort: 30080             # Port opened on every node's public IP.
                                  